<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Dark Mode Panel Sample</title>
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #020617; color: #e5e7eb; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .panel { width: 340px; border-radius: 24px; padding: 18px; background: rgba(15,23,42,.96); box-shadow: 0 24px 70px rgba(0,0,0,.45); border: 1px solid #334155; }
    h1 { font-size: 16px; margin: 0 0 14px; }
    label { display: block; margin: 12px 0 6px; color: #94a3b8; font-size: 12px; }
    select, input { width: 100%; border: 1px solid #475569; border-radius: 12px; padding: 10px; background: #020617; color: #e5e7eb; }
    .efforts { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
    button { border: 0; border-radius: 12px; padding: 9px; background: #334155; color: #e5e7eb; font-weight: 700; }
    .active { background: #1e3a8a; color: #bfdbfe; }
    .status { margin-top: 12px; padding: 10px; border-radius: 14px; background: #0f172a; color: #cbd5e1; font-size: 12px; white-space: pre-line; }
  </style>
</head>
<body>
  <section class="panel">
    <h1>Model Injector Pro · Dark</h1>
    <label>目标模型</label>
    <select><option>GPT-5.5 Pro</option></select>
    <label>Reasoning effort</label>
    <div class="efforts"><button>Light</button><button>Standard</button><button class="active">Extended</button><button>Heavy</button></div>
    <div class="status">状态：启用
模型：gpt-5-5-pro
发现模型：12</div>
  </section>
</body>
</html>
