<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Compact Panel Sample</title>
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: linear-gradient(135deg, #dbeafe, #ccfbf1); font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .dock { width: 280px; border-radius: 22px; padding: 14px; background: rgba(255,255,255,.92); box-shadow: 0 18px 55px rgba(15,23,42,.22); }
    .top { display: flex; align-items: center; justify-content: space-between; font-weight: 800; }
    .pill { font-size: 11px; border-radius: 999px; padding: 4px 8px; background: #dcfce7; color: #166534; }
    .line { margin-top: 10px; padding: 10px; border-radius: 14px; background: #f8fafc; font-size: 12px; color: #334155; }
    button { width: 100%; margin-top: 10px; border: 0; border-radius: 14px; padding: 10px; background: #2563eb; color: white; font-weight: 800; }
  </style>
</head>
<body>
  <section class="dock">
    <div class="top"><span>MI Compact</span><span class="pill">ON</span></div>
    <div class="line">模型：gpt-5-5-thinking<br>Effort：standard<br>上下文：8.2K tokens</div>
    <button>打开完整面板</button>
  </section>
</body>
</html>
