<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Model Discovery Sample</title>
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f8fafc; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .card { width: 360px; border-radius: 24px; padding: 18px; background: #fff; box-shadow: 0 20px 60px rgba(15,23,42,.18); border: 1px solid #e2e8f0; }
    h1 { font-size: 16px; margin: 0 0 12px; }
    .model { display: flex; justify-content: space-between; padding: 10px; border-radius: 14px; background: #f1f5f9; margin: 8px 0; }
    .tag { color: #2563eb; font-weight: 800; font-size: 12px; }
    .muted { color: #64748b; font-size: 12px; }
  </style>
</head>
<body>
  <section class="card">
    <h1>发现模型</h1>
    <div class="model"><span>GPT-5.5 Thinking</span><span class="tag">reasoning</span></div>
    <div class="model"><span>GPT-4o</span><span class="tag">128K</span></div>
    <div class="model"><span>Custom slug</span><span class="tag">manual</span></div>
    <p class="muted">从 /backend-api/models 捕获并归一化模型列表。</p>
  </section>
</body>
</html>
