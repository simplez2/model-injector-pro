<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ChatGPT Model Injector Pro - Panel Sample</title>
  <style>
    :root { color-scheme: light dark; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #eef2ff; }
    .panel { width: 340px; border-radius: 24px; padding: 18px; background: white; box-shadow: 0 24px 70px rgba(15, 23, 42, .22); }
    h1 { font-size: 16px; margin: 0 0 12px; }
    label { display: block; color: #64748b; font-size: 12px; margin: 12px 0 6px; }
    select, input { width: 100%; border: 1px solid #cbd5e1; border-radius: 12px; padding: 10px; }
    .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
    .grid button, .actions button { border: 0; border-radius: 12px; padding: 9px; font-weight: 700; }
    .active { background: #dbeafe; color: #1d4ed8; }
    .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 12px; }
    .primary { background: #2563eb; color: white; }
    .status { white-space: pre-line; margin-top: 12px; border-radius: 14px; padding: 10px; background: #f8fafc; color: #334155; font-size: 12px; }
  </style>
</head>
<body>
  <main class="panel">
    <h1>Model Injector Pro</h1>
    <label>目标模型</label>
    <select><option>GPT-5.5 Thinking · 196K</option><option>Custom / 自定义</option></select>
    <label>Reasoning effort</label>
    <div class="grid"><button>Light</button><button class="active">Standard</button><button>Extended</button><button>Heavy</button></div>
    <div class="actions"><button class="primary">启用覆盖</button><button>刷新模型</button></div>
    <div class="status">状态：启用
模型：gpt-5-5-thinking
估算上下文：12.4K / 196K</div>
  </main>
</body>
</html>
